<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport", content = "width=device-width, initial-scale=1.0">
        <title>event handling in javascript, interactive elements, and form validation</title>
        <link rel="stylesheet" href="Style/styles.css">
    </head>
    <body>
    <!--event handlers-->
    <input type="text" id="myInput" placeholder="Type something..." />


  <!-- Interactive Feature 1: FAQ Section -->
      <section class="faq">
    <h2>Frequently Asked Questions</h2>
    <div class="faq-item">
      <button class="faq-question">What is this site about?</button>
      <div class="faq-answer hidden">This site is a demo of JavaScript interactivity.</div>
    </div>
    <div class="faq-item">
      <button class="faq-question">How does the form work?</button>
      <div class="faq-answer hidden">It uses JavaScript for custom validation.</div>
    </div>
  </section>
  <!-- form validation -->
    <form id="myForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <span id="usernameError" class="error"></span>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <span id="emailError" class="error"></span>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <span id="passwordError" class="error"></span>
        <br><br>
        <button type="submit">Submit</button>
    </form>

        <script src="scripts/script.js"></script>
    </body>
</html>
